; Project-level PHP overrides.
; Activated by setting PHPRC=/app in the Railway service environment.
; Both the artisan parent process and the spawned `php -S` worker inherit
; PHPRC, so the limits apply to inbound HTTP requests as well.

upload_max_filesize = 10M
post_max_size       = 12M
memory_limit        = 256M
max_execution_time  = 120
max_input_time      = 120

; Be permissive about file uploads (default is 20).
max_file_uploads    = 20
